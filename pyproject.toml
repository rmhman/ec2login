[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ec2login"
version = "1.0.0"
description = "Interactive AWS EC2 instance selector with SSM Session Manager"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["aws", "ec2", "ssm", "session-manager", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
]

dependencies = [
    "boto3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/yourusername/ec2login"
Documentation = "https://github.com/yourusername/ec2login#readme"
Repository = "https://github.com/yourusername/ec2login.git"
"Bug Tracker" = "https://github.com/yourusername/ec2login/issues"

[project.scripts]
ec2login = "ec2login.cli:main"

[tool.setuptools]
packages = ["ec2login"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39']

[tool.isort]
profile = "black"
line_length = 100
